    surrogate_hid_node: [64, 128, 256, 512]
    surrogate_hid_layer: [1, 2, 3]
    disc_conv_channels: [4, 8, 16,32]
    disc_conv2_channels: [4, 8, 16]
    disc_conv2_stride: [2, 3, 4]
