surrogate_best_model_path: model/surrogate_best.pt
optuna:
  study_name: surrogate_hpo
  n_trials: 30
  trial_epochs: 80
  direction: minimize
  pruner: median
  warmup_epochs: 20
  best_params_path: model/surrogate_optuna_best.yaml
  search_space:
    surrogate_lr: [1e-5, 3e-3, log]
